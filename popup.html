<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GB QR</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="wrap">
      <h1>GB QR</h1>

      <label class="label" for="gbexp">gbexp (experiment)</label>
      <div class="row">
        <input id="gbexp" inputmode="numeric" placeholder="202603" />
        <button id="gen" class="btn">Generate</button>
      </div>

      <div class="small">
        Base URL: <span id="baseUrlText"></span>
      </div>

      <div id="error" class="error" hidden></div>

      <div class="grid" id="grid"></div>

      <div class="footer">
        <button id="copyAll" class="btn btn-secondary" disabled>Copy all URLs</button>
        <button id="reset" class="btn btn-secondary">Reset</button>
      </div>
    </div>

    <script src="vendor/qrcode.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
