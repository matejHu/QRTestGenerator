<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GrowthBook QR code generator</title>
  <link rel="stylesheet" href="popup.css" />
</head>

<body>
  <div class="wrap">
    <div class="header">
      <h1>GrowthBook QR code generator</h1>
      <div style="display: flex; gap: 6px; align-items: center;">
        <button id="themeToggle" class="btn btn-theme-toggle" title="Toggle theme">🌙</button>
        <button id="reset" class="btn btn-reset-small">Reset</button>
      </div>
    </div>

<div class="modeRow">
  <button id="modeExp" class="modeBtn modeBtnActive" type="button">Single</button>
  <button id="multiExpBtn" class="modeBtn" type="button">Multiple</button>
  <button id="modeUrl" class="modeBtn" type="button">One-page URL</button>
</div>

  <div id="sectionExp">
    <div style="margin-top: 10px;">
      <label class="label" for="env">Environment</label>
      <select id="env" class="select">
        <option value="staging">Staging</option>
        <option value="dev">Dev</option>
        <option value="custom">Custom</option>
      </select>
    </div>

    <div id="customUrlRow" hidden style="margin-top: 8px;">
      <label class="label" for="customUrl">Custom base URL</label>
      <input id="customUrl" placeholder="https://..." />
      <div id="customUrlInfo" class="small custom-url-info" hidden></div>
      <div id="alsoGenerateMasterRow" style="margin-top: 10px; display: flex; align-items: center; gap: 8px;">
        <label class="checkboxLabel" style="margin-bottom: 0;">
          <input type="checkbox" id="alsoGenerateMaster" />
          Also generate QR for comparison environment
        </label>
      </div>
      <div id="customMasterUrlRow" hidden style="margin-top: 8px;">
        <label class="label" for="customMasterEnv">Compare with</label>
        <select id="customMasterEnv" class="select">
          <option value="staging">Staging</option>
          <option value="dev">Dev</option>
        </select>
        <div class="small">Generates a second set of QR codes on the selected environment — place them side by side to reproduce the bug and verify the fix.</div>
      </div>
    </div>

    <div class="small" style="margin-top: 8px; margin-bottom: 8px;">
      Base URL: <span id="baseUrlText"></span>
    </div>

    <div style="margin-top: 10px;">
      <label class="label" for="localization">Localization</label>
      <select id="localization" class="select">
        <option value="">Default</option>
        <option value="en">English (en)</option>
        <option value="cs">Czech (cs)</option>
        <option value="nl">Dutch (nl)</option>
        <option value="fr">French (fr)</option>
        <option value="de">German (de)</option>
        <option value="hu">Hungarian (hu)</option>
        <option value="it">Italian (it)</option>
        <option value="ja">Japanese (ja)</option>
        <option value="ko">Korean (ko)</option>
        <option value="pl">Polish (pl)</option>
        <option value="pt">Portuguese (pt)</option>
        <option value="ru">Russian (ru)</option>
        <option value="sk">Slovak (sk)</option>
        <option value="es">Spanish (es)</option>
        <option value="tr">Turkish (tr)</option>
      </select>
    </div>

    <div style="margin-top: 8px; margin-bottom: 12px;">
      <label class="label" for="flag">Flag</label>
      <select id="flag" class="select">
        <option value="">None</option>
        <option value="f01">/f01/</option>
        <option value="m01">/m01/</option>
        <option value="welcome">/welcome/</option>
        <option value="chm01">/chm01/</option>
        <option value="chf01">/chf01/</option>
        <option value="hopif01">/hopif01/</option>
        <option value="milicaf01">/milicaf01/</option>
        <option value="milicam01">/milicam01/</option>
        <option value="tchm01">/tchm01/</option>
        <option value="wallpif01">/wallpif01/</option>
      </select>
    </div>

    <div id="expMode">
      <div class="experimentField">
        <div class="row" style="margin-bottom: 0; gap: 8px; flex-wrap: nowrap; align-items: flex-end;">
          <div style="flex: 3 1 0; min-width: 0; display: flex; flex-direction: column; justify-content: flex-end;">
            <label class="label" style="margin-bottom: 6px;">Experiment</label>
            <input id="gbexp" inputmode="numeric" placeholder="Test id" style="width: 100%; min-width: 0;" />
          </div>
          <div style="flex: 1 1 0; min-width: 0; max-width: 120px; display: flex; flex-direction: column; justify-content: flex-end;">
            <label class="label" for="variantCount" style="margin-bottom: 6px;">Var. count</label>
            <input id="variantCount" inputmode="numeric" placeholder="Count" style="width: 100%; min-width: 0;" />
          </div>
        </div>
      </div>
      <button id="gen" class="btn" style="width: 100%; margin-top: 10px;">Generate QR</button>
    </div>

    <div id="multipleExpMode" hidden>
      <div id="experimentsContainer"></div>
      <button id="addExperiment" class="btn btn-secondary" style="width: 100%; margin-top: 10px;">+ Add Experiment</button>
      <button id="genMultiple" class="btn" style="width: 100%; margin-top: 10px;">Generate QR</button>
    </div>

    <div id="error" class="error" hidden></div>
  </div>

<div id="sectionUrl" hidden>
  <div id="errorUrl" class="error" hidden></div>

  <label class="label" for="urlInput">Paste URL (branch preview etc.)</label>
  <input id="urlInput" placeholder="https://..." style="width: 100%;" />
  <button id="genUrl" class="btn" style="width: 100%; margin-top: 10px;">Generate QR</button>

  <button id="goToPageUrl" class="btn btn-secondary" style="width: 100%; margin-top: 8px;" disabled>Go to page</button>

  <div class="small" style="margin-top: 6px; opacity: 0.75;">
    Tip: Right-click any link → "Generate QR"
  </div>
</div>

    <div class="grid" id="grid"></div>

    <div class="footer">
      <button id="copyAll" class="btn btn-secondary" disabled>Copy all URLs</button>
    </div>
  </div>

  <script src="vendor/qrcode.js"></script>
  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>

</html>
